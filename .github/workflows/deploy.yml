name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  # Lets you manually trigger a deploy from the Actions tab without a push
  workflow_dispatch:

# Needed so this workflow is allowed to publish to Pages
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate real firebase-config.js from template
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
        run: |
          if [ -z "$FIREBASE_API_KEY" ]; then
            echo "::error::FIREBASE_API_KEY repository secret is not set. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi
          python3 -c "
          import os
          with open('js/firebase-config.template.js') as f:
              content = f.read()
          content = content.replace('__FIREBASE_API_KEY__', os.environ['FIREBASE_API_KEY'])
          with open('js/firebase-config.js', 'w') as f:
              f.write(content)
          print('firebase-config.js generated')
          "

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4