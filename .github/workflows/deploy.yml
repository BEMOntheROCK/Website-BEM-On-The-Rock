name: Deploy to GitHub Pages

# NOTE: This workflow deploys two independent things on every push to main:
#   1. The static site itself, to GitHub Pages (the "deploy" job below).
#   2. Cloud Functions + Firestore rules, to Firebase (the "deploy-functions"
#      job below) — these live on Firebase's servers, completely separately
#      from GitHub Pages, and previously had NO automated deploy at all.
#      Editing functions/index.js or firestore.rules and pushing to GitHub
#      only ever updated the *site*; the actual Cloud Functions code
#      running in production stayed whatever was last deployed by hand,
#      silently drifting out of sync with the repo. This job closes that
#      gap so a normal push deploys everything, the same way it already
#      does for the site.
#
# One-time setup required for the "deploy-functions" job to work: it needs
# a FIREBASE_TOKEN repository secret. To generate one (only needs doing
# once, by whoever has admin/owner access on the Firebase project):
#   1. On a computer with Node.js installed, run:
#        npm install -g firebase-tools
#        firebase login:ci
#   2. That opens a browser to sign in, then prints a long token in the
#      terminal — copy it.
#   3. In this GitHub repo: Settings > Secrets and variables > Actions >
#      "New repository secret" > name it FIREBASE_TOKEN > paste the token.
# The Google Cloud project also needs billing enabled and the APIs listed in
# README.md. Until those requirements are met, the Pages deployment still
# succeeds independently, while this Firebase job reports the missing setup.

on:
  push:
    branches: ["main"]
  # Lets you manually trigger a deploy from the Actions tab without a push
  workflow_dispatch:

# Needed so this workflow is allowed to publish to Pages
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate real firebase-config.js from template
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
        run: |
          if [ -z "$FIREBASE_API_KEY" ]; then
            echo "::error::FIREBASE_API_KEY repository secret is not set. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi
          python3 -c "
          import os
          key = os.environ['FIREBASE_API_KEY'].strip().strip('\"').strip(\"'\")
          with open('js/firebase-config.template.js') as f:
              content = f.read()
          content = content.replace('__FIREBASE_API_KEY__', key)
          with open('js/firebase-config.js', 'w') as f:
              f.write(content)
          print('firebase-config.js generated')
          "

      - name: Verify generated file is valid JavaScript
        run: node --check js/firebase-config.js

      - name: Stamp service worker with this deploy's commit SHA
        run: |
          sed -i "s/__BUILD_ID__/${GITHUB_SHA::8}/" service-worker.js
          grep -q "__BUILD_ID__" service-worker.js && { echo "::error::Placeholder replacement failed"; exit 1; } || true
          echo "Stamped CACHE_VERSION with build ${GITHUB_SHA::8}"

      - name: Verify service worker is valid JavaScript
        run: node --check service-worker.js

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-functions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install functions dependencies
        working-directory: functions
        run: npm ci

      - name: Validate Firebase deployment credentials
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          if [ -z "$FIREBASE_TOKEN" ]; then
            echo "::error::FIREBASE_TOKEN repository secret is not set. Add it under Settings > Secrets and variables > Actions."
            echo "::error::Generate it with 'firebase login:ci'. The GitHub Pages deployment is independent and may still succeed."
            exit 1
          fi

          echo "FIREBASE_TOKEN is present; validating Firebase CLI access without printing the token."
          if ! npx firebase-tools@13 projects:list --token "$FIREBASE_TOKEN" --non-interactive >/dev/null; then
            echo "::error::FIREBASE_TOKEN was provided, but Firebase CLI authentication or project access failed. Check that the token belongs to an account with access to website-bem-on-the-rock."
            exit 1
          fi

      - name: Deploy Cloud Functions and Firestore rules
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          set -o pipefail
          deploy_log="$(mktemp)"

          if npx firebase-tools@13 deploy \
            --only functions,firestore:rules,storage \
            --project website-bem-on-the-rock \
            --token "$FIREBASE_TOKEN" \
            --non-interactive \
            --force 2>&1 | tee "$deploy_log"; then
            rm -f "$deploy_log"
            exit 0
          fi

          if grep -Eiq 'requires billing|billing.*enabled|billing account|service disabled|serviceusage.googleapis.com|secret ?manager|secretmanager.googleapis.com|cloudfunctions.googleapis.com|cloudbuild.googleapis.com|artifactregistry.googleapis.com|run.googleapis.com|eventarc.googleapis.com|cloudscheduler.googleapis.com' "$deploy_log"; then
            echo "::error::Firebase deployment reached the project but Google Cloud billing or a required API is unavailable. Link a billing account to website-bem-on-the-rock and enable the Firebase/Cloud Functions, Secret Manager, Cloud Build, Artifact Registry, Cloud Run, Eventarc, Cloud Scheduler, and Service Usage APIs. See README.md for the one-time setup steps."
          else
            echo "::error::Firebase deployment failed after credential validation. Review the Firebase CLI output above; this is not a missing FIREBASE_TOKEN error."
          fi

          rm -f "$deploy_log"
          exit 1